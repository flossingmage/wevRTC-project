<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Waiting Room</title>

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: linear-gradient(135deg, #1e1b4b, #0f172a);
        color: #f1f5f9;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .card {
        width: 420px;
        max-width: 95%;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(10px);
        border-radius: 16px;
        padding: 40px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
      }

      h1 {
        text-align: center;
        margin-bottom: 6px;
      }

      .subtitle {
        text-align: center;
        color: #94a3b8;
        margin-bottom: 25px;
      }

      .code-display {
        background: rgba(0, 0, 0, 0.25);
        border-radius: 10px;
        padding: 18px;
        text-align: center;
        margin-bottom: 25px;
      }

      .label {
        color: #94a3b8;
        font-size: 0.75rem;
        margin-bottom: 6px;
      }

      .code {
        font-size: 2rem;
        letter-spacing: 6px;
        color: #a78bfa;
        font-weight: bold;
      }

      .player-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-bottom: 20px;
      }

      .player-row {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.05);
      }

      .player-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #334155;
      }

      .player-dot.filled {
        background: #22c55e;
        box-shadow: 0 0 10px rgba(34, 197, 94, 0.6);
      }

      .player-name {
        flex: 1;
      }

      .player-tag {
        font-size: 0.7rem;
        color: #94a3b8;
      }

      .waiting {
        text-align: center;
        color: #94a3b8;
        margin-bottom: 20px;
      }

      button {
        width: 100%;
        border: none;
        border-radius: 10px;
        padding: 14px;
        cursor: pointer;
        font-size: 1rem;
        font-weight: 600;
        margin-top: 10px;
      }

      button:hover:not(:disabled) {
        transform: translateY(-2px);
      }

      #start-btn {
        background: linear-gradient(135deg, #6366f1, #8b5cf6);
        color: white;
      }

      #start-btn:disabled {
        background: #374151;
        cursor: not-allowed;
      }

      #leave-btn {
        background: transparent;
        color: #94a3b8;
      }
    </style>
  </head>

  <body>
    <div class="card">
      <h1>Waiting Room</h1>
      <p class="subtitle" id="subtitle">Waiting for players...</p>

      <div class="code-display">
        <div class="label">ROOM CODE</div>
        <div class="code" id="room-code">------</div>
      </div>

      <div class="player-list" id="player-list"></div>

      <p class="waiting" id="status">Connecting...</p>

      <button id="start-btn" disabled>Start Game</button>

      <button id="leave-btn">← Leave Room</button>
    </div>

    <script type="module">
      import {
        joinRoom,
        leaveRoom,
        watchRoom,
        watchStarted,
        startRoom,
      } from "./src/testFireBaseLobby";

      const params = new URLSearchParams(window.location.search);

      const roomId = params.get("code");
      const role = params.get("role");

      const isHost = role === "host";

      document.getElementById("room-code").textContent = roomId;

      const playerList = document.getElementById("player-list");
      const status = document.getElementById("status");
      const startBtn = document.getElementById("start-btn");

      const userId = await joinRoom(roomId);

      watchRoom(roomId, (room) => {
        playerList.innerHTML = "";

        const users = room.users || {};

        const ids = Object.keys(users);

        ids.forEach((id, index) => {
          const row = document.createElement("div");
          row.className = "player-row";

          row.innerHTML = `
            <span class="player-dot filled"></span>
            <span class="player-name">
                ${index === 0 ? "Host" : `Player ${index + 1}`}
                ${id === userId ? "(You)" : ""}
            </span>
            ${index === 0 ? '<span class="player-tag">HOST</span>' : ""}
        `;

          playerList.appendChild(row);
        });

        status.textContent = `${ids.length} player${ids.length === 1 ? "" : "s"} connected`;

        if (isHost) {
          startBtn.disabled = ids.length < 2;
        }
      });

      watchStarted(roomId, (started) => {
        if (started) {
          window.location.href = `call-room.html?code=${roomId}&user=${userId}`;
        }
      });

      startBtn.addEventListener("click", async () => {
        await startRoom(roomId);
      });

      document
        .getElementById("leave-btn")
        .addEventListener("click", async () => {
          await leaveRoom(roomId, userId);
          window.location.href = "index.html";
        });
    </script>
  </body>
</html>
