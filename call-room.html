<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Call Room</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0f172a;
        color: #f1f5f9;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 16px 24px;
        background: rgba(255, 255, 255, 0.04);
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }

      .room-info {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .room-info .label {
        font-size: 0.75rem;
        color: #94a3b8;
      }

      .room-info .code {
        font-weight: 700;
        letter-spacing: 3px;
        color: #a78bfa;
        font-size: 1rem;
      }

      .status {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 0.85rem;
        color: #94a3b8;
      }

      .status-dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #f59e0b;
      }

      .status-dot.connected {
        background: #22c55e;
      }
      .status-dot.disconnected {
        background: #ef4444;
      }

      main {
        flex: 1;
        display: grid;
        /* auto-fit means the grid reflows as tiles are added/removed,
           instead of a fixed 2-column layout for exactly 2 people */
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        grid-auto-rows: minmax(200px, 1fr);
        gap: 16px;
        padding: 20px;
        overflow: auto;
      }

      .video-tile {
        position: relative;
        background: #000;
        border-radius: 14px;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid rgba(255, 255, 255, 0.08);
      }

      .video-tile video {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .video-tile video.mirrored {
        transform: scaleX(-1);
      }

      .video-tile .tag {
        display: flex;
        align-items: center;
        gap: 6px;
        position: absolute;
        bottom: 10px;
        left: 12px;
        background: rgba(0, 0, 0, 0.55);
        padding: 4px 10px;
        border-radius: 6px;
        font-size: 0.8rem;
      }

      .video-tile .placeholder {
        color: #475569;
        font-size: 0.9rem;
        text-align: center;
        padding: 20px;
      }

      footer {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 16px;
        padding: 20px;
        background: rgba(255, 255, 255, 0.04);
        border-top: 1px solid rgba(255, 255, 255, 0.08);
      }

      .control-btn {
        width: 54px;
        height: 54px;
        border-radius: 50%;
        border: none;
        background: rgba(255, 255, 255, 0.08);
        color: #f1f5f9;
        font-size: 1.2rem;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition:
          transform 0.15s ease,
          background 0.15s ease;
      }

      .control-btn:hover {
        transform: translateY(-2px);
        background: rgba(255, 255, 255, 0.15);
      }

      .control-btn.active-off {
        background: #ef4444;
      }

      .control-btn.hang-up {
        background: #ef4444;
        width: 64px;
      }

      .control-btn.hang-up:hover {
        background: #dc2626;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="room-info">
        <span class="label">ROOM CODE</span>
        <span class="code" id="room-code-display">------</span>
      </div>
      <div class="status">
        <span class="status-dot" id="status-dot"></span>
        <span id="status-text">Connecting...</span>
      </div>
    </header>

    <!--This is where all the vidoes are added-->
    <main id="tiles">
      <div class="video-tile" id="local-tile">
        <video id="local-video" autoplay playsinline muted></video>
        <div class="placeholder" id="local-placeholder">
          Waiting for camera...
        </div>
        <span class="tag">You</span>
      </div>
    </main>

    <!--Storing all interactable buttons here-->
    <footer>
      <button class="control-btn" id="mic-btn" title="Toggle microphone">
        🎤
      </button>
      <button class="control-btn" id="cam-btn" title="Toggle camera">📷</button>
      <button class="control-btn" id="mirror-btn" title="Mirror my video">
        ↔️
      </button>
      <button class="control-btn hang-up" id="hangup-btn" title="Leave call">
        📞
      </button>
    </footer>

    <script type="module">
      import {
        register_ui_hooks,
        begin_connection,
        toggle_mic,
        toggle_camera,
        leave_call,
        set_mirrored,
      } from "./src/testFireBase.js";

      //getting info from URL
      const params = new URLSearchParams(window.location.search);
      document.getElementById("room-code-display").textContent =
        params.get("code") ?? "------";

      // define html elements
      const tiles_container = document.getElementById("tiles");
      const local_placeholder = document.getElementById("local-placeholder");
      const local_video = document.getElementById("local-video");
      const status_dot = document.getElementById("status-dot");
      const status_text = document.getElementById("status-text");
      const mic_btn = document.getElementById("mic-btn");
      const cam_btn = document.getElementById("cam-btn");
      const hangup_btn = document.getElementById("hangup-btn");
      const mirror_btn = document.getElementById("mirror-btn");

      let mic_on = true;
      let cam_on = true;
      let mirrored = false;

      // managing tiles
      const remote_tiles = new Map();

      const create_remote_tile = (peer_user_id) => {
        const tile = document.createElement("div");
        tile.className = "video-tile";

        const video = document.createElement("video");
        video.autoplay = true;
        video.playsInline = true;

        const placeholder = document.createElement("div");
        placeholder.className = "placeholder";
        placeholder.textContent = "Connecting...";

        const tag = document.createElement("span");
        tag.className = "tag";
        const dot = document.createElement("span");
        dot.className = "status-dot " + (peer_statuses.get(peer_user_id) ?? "");
        tag.append(dot, document.createTextNode("Peer"));

        tile.append(video, placeholder, tag);
        tiles_container.appendChild(tile);

        const entry = { tile, video, placeholder, dot };
        remote_tiles.set(peer_user_id, entry);
        return entry;
      };

      const remove_remote_tile = (peer_user_id) => {
        peer_statuses.delete(peer_user_id);
        update_header_status();
        const entry = remote_tiles.get(peer_user_id);
        if (!entry) return;
        entry.video.srcObject = null;
        entry.tile.remove();
        remote_tiles.delete(peer_user_id);
      };

      // per-peer connection status, so one peer dropping doesn't mark the whole call as disconnected
      const peer_statuses = new Map();

      const update_header_status = () => {
        const statuses = [...peer_statuses.values()];
        let dot_class, text;
        if (statuses.includes("connected")) {
          dot_class = "connected";
          text = "Connected";
        } else if (statuses.includes("connecting")) {
          dot_class = "";
          text = "Connecting...";
        } else if (statuses.length === 0) {
          dot_class = "";
          text = "Waiting for others...";
        } else {
          dot_class = "disconnected";
          text = "Disconnected";
        }
        status_dot.className = "status-dot " + dot_class;
        status_text.textContent = text;
      };

      register_ui_hooks({
        on_local_stream: (stream) => {
          local_video.srcObject = stream;
          local_placeholder.style.display = "none";
        },
        on_remote_stream: (peer_user_id, stream) => {
          const entry = remote_tiles.get(peer_user_id) ?? create_remote_tile(peer_user_id);
          entry.video.srcObject = stream;
          entry.placeholder.style.display = "none";
        },
        on_peer_left: (peer_user_id) => {
          remove_remote_tile(peer_user_id);
        },
        on_status_change: (peer_user_id, status) => {
          peer_statuses.set(peer_user_id, status);
          const entry = remote_tiles.get(peer_user_id);
          if (entry) entry.dot.className = "status-dot " + status;
          update_header_status();
        },
      });

      mic_btn.addEventListener("click", () => {
        mic_on = !mic_on;
        toggle_mic(mic_on);
        mic_btn.classList.toggle("active-off", !mic_on);
      });

      cam_btn.addEventListener("click", () => {
        cam_on = !cam_on;
        toggle_camera(cam_on);
        cam_btn.classList.toggle("active-off", !cam_on);
      });

      // only flips your own preview; what peers receive is unchanged
      mirror_btn.addEventListener("click", async () => {
        mirrored = !mirrored;
        local_video.classList.toggle("mirrored", mirrored);
        mirror_btn.classList.toggle("active-off", mirrored);
        await set_mirrored(mirrored);
      });

      hangup_btn.addEventListener("click", async () => {
        await leave_call();
        window.location.href = "/";
      });

       begin_connection().catch((err) => {
         console.error("Failed to join call:", err);
         status_text.textContent = "Failed to connect";
         status_dot.className = "status-dot disconnected";
       });
    </script>
  </body>
</html>
